# Ultralytics YOLOv8n 6-channel concat baseline with P2/P3/P4/P5 detection.

nc: 80
channels: 6
scale: n

backbone:
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 1, C2f, [32, True]] # 2-P2/4
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 2, C2f, [64, True]] # 4-P3/8
  - [-1, 1, Conv, [128, 3, 2]] # 5-P4/16
  - [-1, 2, C2f, [128, True]] # 6-P4/16
  - [-1, 1, Conv, [256, 3, 2]] # 7-P5/32
  - [-1, 1, C2f, [256, True]] # 8-P5/32
  - [-1, 1, SPPF, [256, 5]] # 9-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [128]] # 12-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [64]] # 15-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C2f, [32]] # 18-P2/4

  - [-1, 1, Conv, [32, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 1, C2f, [64]] # 21-P3/8

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C2f, [128]] # 24-P4/16

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [256]] # 27-P5/32

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
