# Ultralytics YOLOv8n RGB/IR ResCGAFF-P2 model, residual branch C: raw concat followed by 1x1 projection.

nc: 80
channels: 6
scale: n

# Args: [P2 channels, P3 channels, P4 channels, P5 channels, AFF reduction ratio, residual alpha, base kernel]
backbone:
  - [-1, 1, ResCGAFFP2ResidualBaseBackbone, [32, 64, 128, 256, 4, 0.1, 0]]
  - [0, 1, Index, [32, 0]]
  - [0, 1, Index, [64, 1]]
  - [0, 1, Index, [128, 2]]
  - [0, 1, Index, [256, 3]]

head:
  - [4, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 1, C2f, [32]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]
  - [[14, 17, 20, 23], 1, Detect, [nc]]
