# YOLOv8n RGB/IR: CRRC backbone with ECA before the P3-to-P2 neck upsample.
nc: 80
channels: 6
scale: n
backbone:
  - [-1, 1, ResCGAFFMultiScaleBackbone, [32, 64, 128, 256, 4, 0.1, "CRRC"]]
  - [0, 1, Index, [32, 0]]
  - [0, 1, Index, [64, 1]]
  - [0, 1, Index, [128, 2]]
  - [0, 1, Index, [256, 3]]
head:
  - [4, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]
  - [-1, 1, NeckECA, [64, 3]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 1, C2f, [32]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]
  - [[14, 17, 20, 23], 1, Detect, [nc]]
