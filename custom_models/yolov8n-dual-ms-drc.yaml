# Ultralytics YOLOv8n RGB/IR model with Difference/ResCGAFF/Consistency fusion at P3/P4/P5 (D-R-C).

nc: 80
channels: 6
scale: n

# Args: [P3 channels, P4 channels, P5 channels, AFF reduction ratio, residual alpha, P3/P4/P5 pattern]
backbone:
  - [-1, 1, MultiScaleDualInputBackbone, [64, 128, 256, 4, 0.1, "DRC"]]
  - [0, 1, Index, [64, 0]]
  - [0, 1, Index, [128, 1]]
  - [0, 1, Index, [256, 2]]

head:
  - [3, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 1, C2f, [64]]

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]

  - [[9, 12, 15], 1, Detect, [nc]]
